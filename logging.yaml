root:
  level: debug
  appenders:
    - file_appender
    - console_appender
appenders:
  file_appender:
    kind: file
    path: latest.log
    append: false
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} {M} [{T}/{l}] {m}\n"
  console_appender:
    kind: console
    target: stdout
    tty_only: false
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} {M} [{T}/{l}] {m}\n"
